version: '3.9'

services:

  # ─── Base de données PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: incidentops_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-incidentops_db}
      POSTGRES_USER: ${DB_USER:-incidentops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-incidentops_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incidentops_net

  # ─── Application Django ──────────────────────────────────────────────────
  web:
    build: .
    container_name: incidentops_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - incidentops_net

  # ─── Nginx (reverse proxy) ────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: incidentops_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - incidentops_net

volumes:
  postgres_data:
  media_volume:
  static_volume:

networks:
  incidentops_net:
    driver: bridge

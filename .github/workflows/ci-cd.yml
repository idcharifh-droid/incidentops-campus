name: IncidentOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/incidentops-campus
  PYTHON_VERSION: '3.11'

jobs:

  # ─── Job 1 : Tests & Qualité du code ──────────────────────────────────────
  test:
    name: Tests & Qualité du code
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: incidentops_test
          POSTGRES_USER: incidentops_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 coverage

      - name: Vérification de la qualité du code (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            --count \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,static,media \
            --statistics \
            --ignore=E501,W503

      - name: Exécution des migrations de test
        env:
          DEBUG: 'True'
          SECRET_KEY: 'test-secret-key-for-ci-only'
          DB_NAME: incidentops_test
          DB_USER: incidentops_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
        run: |
          python manage.py migrate --noinput

      - name: Exécution des tests avec couverture
        env:
          DEBUG: 'True'
          SECRET_KEY: 'test-secret-key-for-ci-only'
          DB_NAME: incidentops_test
          DB_USER: incidentops_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
        run: |
          coverage run --source='.' manage.py test --verbosity=2
          coverage report --fail-under=30
          coverage xml
        

      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ─── Job 2 : Build Docker Image ───────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérification de l'image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          docker inspect ${{ env.DOCKER_IMAGE }}:latest

  # ─── Job 3 : Scan de sécurité (avancé) ───────────────────────────────────
  security:
    name: Scan de sécurité
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan des dépendances (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json --output=audit-report.json || true
          cat audit-report.json

      - name: Upload rapport de sécurité
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json

  # ─── Notification résumé ──────────────────────────────────────────────────
  notify:
    name: Résumé du pipeline
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: Résumé
        run: |
          echo "======================================"
          echo "  IncidentOps CI/CD – Résumé"
          echo "======================================"
          echo "  Tests       : ${{ needs.test.result }}"
          echo "  Build Docker: ${{ needs.build.result }}"
          echo "  Branche     : ${{ github.ref_name }}"
          echo "  Commit      : ${{ github.sha }}"
          echo "======================================"

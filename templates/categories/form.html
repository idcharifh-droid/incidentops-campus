{% extends 'base.html' %}
{% block title %}{{ title }} – IncidentOps{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-transparent border-0 fw-semibold pt-4 px-4">{{ title }}</div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nom</label>
            <input type="text" name="name" class="form-control" value="{{ category.name|default:'' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ category.description|default:'' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Icône Bootstrap</label>
            <input type="text" name="icon" class="form-control" value="{{ category.icon|default:'bi-tag' }}"
                   placeholder="ex: bi-wifi, bi-laptop, bi-shield">
            <small class="text-muted">Voir <a href="https://icons.getbootstrap.com" target="_blank">Bootstrap Icons</a></small>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Couleur</label>
            <select name="color" class="form-select">
              {% for val, label in colors %}
              <option value="{{ val }}" {% if category.color == val %}selected{% endif %}>{{ label }}</option>
              {% empty %}
              <option value="primary" {% if category.color == 'primary' %}selected{% endif %}>Bleu (primary)</option>
              <option value="danger" {% if category.color == 'danger' %}selected{% endif %}>Rouge (danger)</option>
              <option value="warning" {% if category.color == 'warning' %}selected{% endif %}>Orange (warning)</option>
              <option value="success" {% if category.color == 'success' %}selected{% endif %}>Vert (success)</option>
              <option value="info" {% if category.color == 'info' %}selected{% endif %}>Cyan (info)</option>
              <option value="secondary" {% if category.color == 'secondary' %}selected{% endif %}>Gris (secondary)</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Enregistrer</button>
            <a href="{% url 'categories:list' %}" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

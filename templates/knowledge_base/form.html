{% extends 'base.html' %}
{% block title %}{{ title }} – IncidentOps{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-transparent border-0 fw-semibold pt-4 px-4">
        <i class="bi bi-book me-2"></i>{{ title }}
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Titre</label>
            <input type="text" name="title" class="form-control" value="{{ article.title|default:'' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Catégorie</label>
            <select name="category" class="form-select">
              <option value="">-- Aucune --</option>
              {% for cat in categories %}
              <option value="{{ cat.id }}" {% if article.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Contenu / Solution</label>
            <textarea name="content" class="form-control" rows="10" required>{{ article.content|default:'' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>Enregistrer
            </button>
            <a href="{% url 'knowledge_base:list' %}" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

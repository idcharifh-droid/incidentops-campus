{% extends 'base.html' %}
{% block title %}Email envoyé – IncidentOps{% endblock %}
{% block public_container %}container py-5{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 text-center">
    <i class="bi bi-envelope-check" style="font-size:3rem;color:#10b981"></i>
    <h4 class="fw-bold mt-3">Email envoyé !</h4>
    <p class="text-muted">Si un compte correspond à cet email, vous recevrez un lien de réinitialisation.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Retour à la connexion</a>
  </div>
</div>
{% endblock %}
